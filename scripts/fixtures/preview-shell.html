<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preparing Preview</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{background:#111827;color:#f9fafb;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center}
.box{max-width:720px;background:#1f2937;border:1px solid #374151;border-radius:8px;padding:18px 20px;box-shadow:0 18px 60px rgba(0,0,0,.35)}
h1{font-size:18px;margin:0 0 8px}
p{margin:8px 0;color:#d1d5db}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#111827}
</style>
</head>
<body>
<div class="box" id="status">
    <h1>Preparing preview...</h1>
    <p>This window is waiting for Animation Stage to send the generated preview.</p>
</div>
<script>
(function() {
    var params = new URLSearchParams(location.search);
    var key = params.get('k') || '';
    var expectedOrigin = location.origin;
    var loaded = false;

    function notify(type, extra) {
        try {
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage(Object.assign({ type: type, key: key }, extra || {}), expectedOrigin);
            }
        } catch (_) {}
    }

    function showError(message) {
        var status = document.getElementById('status');
        if (status) {
            status.innerHTML = '<h1>Preview could not load</h1><p>' + String(message || 'Unknown error') + '</p>';
        }
    }

    window.addEventListener('message', function(event) {
        if (event.origin !== expectedOrigin) return;
        var data = event.data || {};
        if (data.type !== 'animstage-preview-html' || data.key !== key || loaded) return;
        if (typeof data.html !== 'string' || !data.html) {
            showError('The preview payload was empty.');
            notify('animstage-preview-error');
            return;
        }

        loaded = true;
        document.title = 'Animation Preview';
        var status = document.getElementById('status');
        if (status) status.remove();

        // The generated document owns its renderer; preinstalled fallbacks can
        // suppress its scene, facial-animation and asset-loading helpers.

        var frame = document.createElement('iframe');
        frame.setAttribute('sandbox', 'allow-scripts allow-forms allow-downloads allow-popups');
        frame.srcdoc = data.html;
        document.body.appendChild(frame);
        notify('animstage-preview-rendered');
    });

    notify('animstage-preview-ready');
    setInterval(function() {
        if (!loaded) notify('animstage-preview-ready');
    }, 500);
})();
</script>
</body>
</html>
