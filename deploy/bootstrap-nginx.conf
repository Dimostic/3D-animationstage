server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name 3d.animationstage.com;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/animationstage3d/acme; }
    location / { return 404; }
}
