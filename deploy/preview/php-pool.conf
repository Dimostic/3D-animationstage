[stage3d-preview]
user = stage3d-preview-web
group = stage3d-preview-web
listen = /run/php/php8.4-fpm-stage3d-preview.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
clear_env = yes
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
; Tiny wrappers benefit more from predictable atomic release switches than caching.
php_admin_flag[opcache.enable] = off
php_admin_value[realpath_cache_ttl] = 0
php_admin_value[memory_limit] = 128M
php_admin_value[open_basedir] = /srv/animationstage3d-preview/:/etc/animationstage3d-preview/:/var/lib/animationstage3d-preview/tmp/

env[STUDIO3D_CONFIG_DIR] = /etc/animationstage3d-preview
php_admin_value[upload_tmp_dir] = /var/lib/animationstage3d-preview/tmp/
php_admin_value[session.save_path] = /var/lib/animationstage3d-preview/tmp/
