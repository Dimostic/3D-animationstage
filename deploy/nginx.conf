# Dedicated host only. Application files and preview shell require beta login.
log_format stage3d_private '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name 3d.animationstage.com;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/animationstage3d/acme; }
    location / { return 301 https://3d.animationstage.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 3d.animationstage.com;
    if ($host != '3d.animationstage.com') { return 444; }
    ssl_certificate /etc/letsencrypt/live/3d.animationstage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3d.animationstage.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/animationstage3d/current/dist;
    autoindex off;
    client_max_body_size 1m;
    auth_basic 'Animation Stage 3D private beta';
    auth_basic_user_file /etc/animationstage3d/htpasswd;
    access_log /var/log/nginx/animationstage3d-access.log stage3d_private;
    error_log /var/log/nginx/animationstage3d-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security 'max-age=86400' always;

    location ~ ^/(?:index\.html)?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/animationstage3d/current/server/index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm-stage3d.sock;
    }
    location = /api/preview-shell.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/animationstage3d/current/server/preview.php;
        fastcgi_pass unix:/run/php/php8.4-fpm-stage3d.sock;
    }
    location = /api/realistic-3d-asset.php {
        auth_basic off;
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/animationstage3d/current/server/asset.php;
        fastcgi_pass unix:/run/php/php8.4-fpm-stage3d.sock;
    }
    location ^~ /__3d_asset/ {
        internal;
        auth_basic off;
        alias /srv/animationstage3d/current/dist/;
        types { application/javascript js; model/gltf-binary glb; }
        add_header Access-Control-Allow-Origin '*' always;
        add_header Cache-Control 'private, no-store' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        access_log off;
    }
    location ~ /\. { deny all; }
    location ~ ^/(?:js|css|assets)/ { try_files $uri =404; }
    location = /asset-version.txt { try_files $uri =404; }
    location / { return 404; }
}
