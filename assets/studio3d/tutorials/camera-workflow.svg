<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">Compose, preview and save a camera move</title><desc id="desc">Two camera frames, wide Start and close Finish, connect across a timeline with a move followed by a hold. The camera monitor displays the audience view.</desc><rect width="1000" height="340" rx="12" fill="#152638"/><g font-family="system-ui,sans-serif"><text x="35" y="36" fill="#b3d9ff" font-size="15">COMPOSE IN THE EDITOR</text><g stroke="#87bdf1" fill="#213d56" stroke-width="2"><rect x="35" y="60" width="260" height="150" rx="6"/><rect x="365" y="60" width="260" height="150" rx="6"/><rect x="700" y="60" width="260" height="150" rx="6"/></g><g fill="#e1b49b"><circle cx="165" cy="98" r="13"/><rect x="151" y="115" width="28" height="43" rx="8"/><path d="M154 158h9v32h-9zm14 0h9v32h-9z"/><circle cx="495" cy="112" r="31"/><path d="M457 150h76v60h-76z"/></g><path d="M315 135h28m-8-8 8 8-8 8M645 135h32m-8-8 8 8-8 8" stroke="#ffdc84" fill="none" stroke-width="3"/><text x="53" y="235" fill="#e0edfa" font-size="16">1 · Capture Start</text><text x="383" y="235" fill="#e0edfa" font-size="16">2 · Capture Finish</text><text x="718" y="235" fill="#e0edfa" font-size="16">3 · Scrub and save</text><g fill="#e1b49b"><circle cx="830" cy="108" r="24"/><path d="M801 138h58v72h-58z"/></g><path d="M787 61v149m86-149v149M701 110h258M701 160h258" stroke="#9eb8d477" stroke-width="1"/><text x="720" y="82" fill="#c1dfff" font-size="11">CAMERA MONITOR · 16:9</text><rect x="35" y="273" width="185" height="25" rx="4" fill="#5c4d80"/><rect x="220" y="273" width="445" height="25" rx="4" fill="#9271c5"/><rect x="665" y="273" width="295" height="25" rx="4" fill="#5c4d80"/><text x="82" y="291" fill="white" font-size="12">Wide hold</text><text x="350" y="291" fill="white" font-size="12">Move Start → Finish</text><text x="755" y="291" fill="white" font-size="12">Hold Finish</text><g fill="#aac6df" font-size="12"><text x="35" y="322">0 s</text><text x="215" y="322">2 s</text><text x="657" y="322">5 s</text><text x="938" y="322">7 s</text></g></g></svg>
